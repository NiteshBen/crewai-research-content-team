[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crewai-research-content-team"
version = "0.2.0"
description = "Two-agent CrewAI pipeline: research a topic, draft a publication-ready blog post."
readme = "README.md"
authors = [
    { name = "Nitesh Beniwal" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/NiteshBen/crewai-research-content-team"

[project.scripts]
research-team = "main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
